[package]
name = "minijinja-js"
version = "3.0.0-alpha.3"
description = "a powerful template engine with minimal dependencies"
publish = false
edition = "2021"
license = "Apache-2.0"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
rust-version = "1.81"

[lib]
bench = false
crate-type = ["cdylib", "rlib"]
doc = false
doctest = false
test = false

[features]
default = ["console_error_panic_hook"]
# Exposes the unstable internals of the engine (tokens, AST and instructions)
# for the playground.  Not enabled for the published package.
unstable_machinery = ["minijinja/unstable_machinery_serde"]

[target.'cfg(target_family="wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = "0.3.106"
minijinja = { version = "3.0.0-alpha.3", path = "../minijinja", features = ["json", "fuel", "preserve_order", "urlencode", "loop_controls", "unicode"] }
minijinja-contrib = { version = "3.0.0-alpha.3", path = "../minijinja-contrib", features = ["pycompat", "html_entities", "wordwrap"] }
wasm-bindgen = "0.2.129"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz','--enable-bulk-memory','--enable-nontrapping-float-to-int']
