[package]
name = "minijinja"
version = "3.0.0-alpha.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
description = "a powerful template engine for Rust with minimal dependencies"
homepage = "https://github.com/mitsuhiko/minijinja"
repository = "https://github.com/mitsuhiko/minijinja"
keywords = ["jinja", "jinja2", "templates", "template"]
categories = ["template-engine"]
readme = "README.md"
rust-version = "1.70"
exclude = ["tests"]

[package.metadata.docs.rs]
features = ["json", "urlencode", "fuel"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "doc-header.html"]

[features]
default = [
    "builtins",
    "debug",
    "macros",
    "multi_template",
    "adjacent_loop_items",
    "std_collections",
]

# API features
preserve_order = ["indexmap"]
debug = []
unicode = ["unicode-ident", "unicase"]
std_collections = []
serde = ["dep:serde"]

# Speedups
speedups = ["v_htmlescape", "dep:zmij", "dep:itoa"]

# Engine Features
builtins = []
macros = []
multi_template = []
adjacent_loop_items = []
loop_controls = []
fuel = []
stacker = ["dep:stacker"]

# Extra Filters
json = []
urlencode = ["percent-encoding"]

# Internal Features that should not be used
internal_debug = []
unstable_machinery = ["internal_debug"]
unstable_machinery_serde = ["serde", "unstable_machinery", "serde/derive"]
internal_safe_search = []

[dependencies]
serde = { version = "1.0.130", optional = true }
v_htmlescape = { version = "0.15.8", optional = true }
zmij = { version = "1.0.17", optional = true }
itoa = { version = "1.0.11", optional = true }

percent-encoding = { version = "2.2.0", optional = true }
indexmap = { version = "2.2.0", optional = true }
unicode-ident = { version = "1.0.5", optional = true }
unicase = { version = "2.6.0", optional = true }
stacker = { version = "0.1.15", optional = true }

[dev-dependencies]
insta = { version = "1.38.0", features = ["glob", "serde"] }
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.68"
similar-asserts = "1.4.2"
