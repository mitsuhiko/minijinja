[package]
name = "minijinja-contrib"
version = "3.0.0-alpha.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
description = "Extra utilities for MiniJinja"
homepage = "https://github.com/mitsuhiko/minijinja"
repository = "https://github.com/mitsuhiko/minijinja"
keywords = ["jinja", "jinja2", "templates"]
readme = "README.md"
rust-version = "1.70"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "doc-header.html"]
all-features = true

[features]
default = []
pycompat = ["minijinja/builtins"]
datetime = ["dep:jiff"]
timezone = ["datetime", "jiff?/tzdb-bundle-platform", "jiff?/tzdb-concatenated", "jiff?/tzdb-zoneinfo"]
rand = []
html_entities = []
wordcount = ["unicode_categories"]
wordwrap = ["textwrap"]
unicode_wordwrap = ["wordwrap", "textwrap/unicode-linebreak", "textwrap/unicode-width"]

[dependencies]
jiff = { version = "0.2.35", optional = true, default-features = false, features = ["std"] }
minijinja = { version = "3.0.0-alpha.0", path = "../minijinja", default-features = false }
textwrap = { version = "0.16.2", optional = true, default-features = false, features = ["smawk"] }
unicode_categories = { version = "0.1.1", optional = true }

[dev-dependencies]
insta = { version = "1.38.0", features = ["glob", "serde"] }
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
chrono = { version = "0.4.26", features = ["serde"] }
minijinja = { version = "3.0.0-alpha.0", path = "../minijinja", features = ["serde"] }
similar-asserts = "1.4.2"
