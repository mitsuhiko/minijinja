name: Tests

on: [push, pull_request]

jobs:
  test-latest:
    name: Test on Latest Stable
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'
      - name: Check
        run: make check
      - name: Test
        run: make test

  test-cabi:
    name: Test C ABI C library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: make -C minijinja-cabi test

  test-nightly:
    name: Test on nightly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Wipe Cargo.lock
        run: rm Cargo.lock
      - name: Check
        run: make check
      - name: Test
        run: make test-rust
      - name: -Znext-solver
        run: RUSTFLAGS="-Znext-solver" cargo check --all --all-features

  test-32bit:
    name: Check on 1.70.0 (32bit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.70.0
          targets: armv5te-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@v2
      - name: Install Cross Deps
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y gcc-arm-linux-gnueabi libc6-dev-armel-cross
      - name: Restore Cargo.lock
        run: ./scripts/use-msrv-lock.sh
      - name: Check
        run: cargo check --all-features -p minijinja --target armv5te-unknown-linux-gnueabi

  test-fuel-feature:
    name: Check on 1.70.0 (fuel feature)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.70.0
      - uses: Swatinem/rust-cache@v2
      - name: Restore Cargo.lock
        run: ./scripts/use-msrv-lock.sh
      - name: Check
        run: cargo check --no-default-features -p minijinja --features fuel

  test-stable:
    name: Test on 1.70.0
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.70.0
      - uses: Swatinem/rust-cache@v2
      - name: Restore Cargo.lock
        run: ./scripts/use-msrv-lock.sh
      - name: Test
        run: make test-msrv

  test-no-lock:
    name: Test on Latest (No Lock)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove Cargo.lock
        run: rm Cargo.lock
      - name: Test
        run: make test-rust

  test-wasi:
    name: Test on WASI
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install WasmTime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "13.0.0"
      - name: Test
        run: make wasi-test

  test-python:
    name: Test Python binding (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, freethreaded]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
        if: matrix.variant == 'freethreaded'
      - name: Install free-threaded Python
        if: matrix.variant == 'freethreaded'
        run: |
          set -euo pipefail
          TARGET=cpython-3.14.0+freethreaded-linux-x86_64-gnu
          uv python install "$TARGET"
          PYTHON_BIN=$(uv python find "$TARGET")
          echo "$(dirname "$PYTHON_BIN")" >> "$GITHUB_PATH"
          "$PYTHON_BIN" -c "import sys; print('Free threading:', not sys._is_gil_enabled())"
      - name: Test
        run: make python-test

  test-js:
    name: Test JS binding (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install wasm-pack
        run: |
          curl -sSf https://drager.github.io/wasm-pack/installer/init.sh | sh
      - name: Test
        run: make js-test
  
  test-cli-linux:
    name: Test CLI Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: make check-cli
      - name: Test
        run: make test-cli
  
  test-cli-windows:
    name: Test CLI Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: make check-cli
      - name: Test
        run: make test-cli
