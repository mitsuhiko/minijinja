name: Build Wheels

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    name: macOS Wheels (universal2)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --strip --target universal2-apple-darwin --out dist -m minijinja-py/Cargo.toml
      # Free-threaded wheels need a separate maturin invocation, otherwise the
      # abi3 wheel above is turned into a version-specific one.  This produces
      # a cp314t wheel and a cp315-abi3.abi3t wheel (PEP 803).
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --strip --target universal2-apple-darwin --out dist -m minijinja-py/Cargo.toml --interpreter python3.14t python3.15t
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos
          path: dist

  linux:
    name: Linux Wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [i686, x86_64, armv7l, aarch64]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Wipe Config
        run: |
          rm .cargo/config.toml
      # Docker 29.4.2 on the ubuntu-26.04 runners blocks socketcall(2) in its
      # default seccomp profile, which breaks networking for the 32-bit glibc
      # in the i686 manylinux image.  Disable seccomp for that container until
      # the runners ship Docker 29.4.3 or later.
      # https://github.com/actions/runner-images/issues/14790
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -m minijinja-py/Cargo.toml --interpreter "3.10"
          manylinux: auto
          docker-options: ${{ matrix.target == 'i686' && '--security-opt seccomp=unconfined' || '' }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -m minijinja-py/Cargo.toml --interpreter python3.14t python3.15t
          manylinux: auto
          docker-options: ${{ matrix.target == 'i686' && '--security-opt seccomp=unconfined' || '' }}
      - uses: astral-sh/setup-uv@v10.2.0
        if: matrix.target == 'x86_64'
      - name: Test free-threaded wheels
        if: matrix.target == 'x86_64'
        run: |
          set -euo pipefail
          for py in 3.14t 3.15t; do
            uv venv --python "$py" ".venv-$py"
            VIRTUAL_ENV=".venv-$py" uv pip install --no-index --find-links dist minijinja
            VIRTUAL_ENV=".venv-$py" uv pip install pytest
            "./.venv-$py/bin/python" -c "import sys, minijinja; assert not sys._is_gil_enabled()"
            (cd minijinja-py && "../.venv-$py/bin/python" -m pytest tests)
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  linux-musl:
    name: Linux musl Wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [i686, x86_64, armv7l, aarch64]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Wipe Config
        run: |
          rm .cargo/config.toml
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -m minijinja-py/Cargo.toml --interpreter "3.10"
          manylinux: musllinux_1_2
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -m minijinja-py/Cargo.toml --interpreter python3.14t python3.15t
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-musl-${{ matrix.target }}
          path: dist

  windows:
    name: Windows Wheels
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -m minijinja-py/Cargo.toml
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist -m minijinja-py/Cargo.toml --interpreter python3.14t python3.15t
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  pyodide:
    name: Pyodide Wheels (${{ matrix.pyodide }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One wheel per Pyodide ABI (pyemscripten_2025_0, pyemscripten_2026_0).
        # The host Python must match the Python of the Pyodide release.
        include:
          - pyodide: "0.29.5"
            python: "3.13"
          - pyodide: "314.0.7"
            python: "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install pyodide-build
        run: |
          pip install pyodide-build
          pyodide xbuildenv install ${{ matrix.pyodide }}
          pyodide xbuildenv install-emscripten
          echo "RUSTUP_TOOLCHAIN=$(./scripts/setup-pyodide-rust.sh)" >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          source "$(pyodide config get emsdk_dir)/emsdk_env.sh"
          pyodide build minijinja-py -o dist
      - name: Test wheel
        run: |
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/pip install dist/*.whl pytest
          cd minijinja-py
          ../.venv-pyodide/bin/python -m pytest tests
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pyodide-${{ matrix.pyodide }}
          path: dist

  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m minijinja-py/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: Publish to pypi.org
    runs-on: ubuntu-latest
    needs:
      - sdist
      - windows
      - linux
      - linux-musl
      - macos
      - pyodide
    env:
      MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    if: ${{ !github.event.pull_request && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: ./scripts/verify-release.sh "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
