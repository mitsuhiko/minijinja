name: Publish Package to npmjs
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        run: ./scripts/verify-release.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Update npm
        run: npm install -g npm@latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl -sSf https://drager.github.io/wasm-pack/installer/init.sh | sh
      - name: Build and publish
        working-directory: ./minijinja-js
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG" ~/.npmrc
          npm ci
          make test
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm_tag="next"
          else
            npm_tag="latest"
          fi
          echo "Publishing minijinja-js $version with the '$npm_tag' dist-tag"
          npm publish --provenance --access public --tag "$npm_tag"
